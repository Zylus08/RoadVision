# RoadVision System Configuration

model:
  name: "nvidia/segformer-b0-finetuned-cityscapes-1024-1024"
  architecture: "segformer"
  device: "auto" # 'auto', 'cuda', or 'cpu'
  input_size: [1024, 1024] # [H, W] or native
  cache_dir: "~/.cache/huggingface"
  torch_cache_dir: "~/.cache/torch"

# Cityscapes 19 official evaluation classes
classes:
  0: "road"
  1: "sidewalk"
  2: "building"
  3: "wall"
  4: "fence"
  5: "pole"
  6: "traffic light"
  7: "traffic sign"
  8: "vegetation"
  9: "terrain"
  10: "sky"
  11: "person"
  12: "rider"
  13: "car"
  14: "truck"
  15: "bus"
  16: "train"
  17: "motorcycle"
  18: "bicycle"

palette:
  0: [128, 64, 128]    # road: purple
  1: [244, 35, 232]    # sidewalk: pink
  2: [70, 70, 70]      # building: dark grey
  3: [102, 102, 156]   # wall: blue-grey
  4: [190, 153, 153]   # fence: light mauve
  5: [153, 153, 153]   # pole: medium grey
  6: [250, 170, 30]    # traffic light: orange-yellow
  7: [220, 220, 0]     # traffic sign: yellow
  8: [107, 142, 35]    # vegetation: olive green
  9: [152, 251, 152]   # terrain: pale green
  10: [70, 130, 180]   # sky: steel blue
  11: [220, 20, 60]    # person: red
  12: [255, 0, 0]      # rider: bright red
  13: [0, 0, 142]      # car: deep blue
  14: [0, 0, 70]       # truck: navy
  15: [0, 60, 100]     # bus: teal-blue
  16: [0, 80, 100]     # train: dark cyan
  17: [0, 0, 230]      # motorcycle: royal blue
  18: [119, 11, 32]    # bicycle: dark red

corruptions:
  seed: 42
  types:
    - "low_light"
    - "fog"
    - "rain"
    - "gaussian_blur"
    - "gaussian_noise"
  severities: [1, 2, 3, 4, 5]

  # Low light corruption parameters (alpha, gamma per severity)
  low_light:
    1: {alpha: 0.80, gamma: 1.25}
    2: {alpha: 0.60, gamma: 1.50}
    3: {alpha: 0.45, gamma: 1.85}
    4: {alpha: 0.30, gamma: 2.20}
    5: {alpha: 0.15, gamma: 2.70}

  # Fog corruption parameters (beta and airlight per severity)
  fog:
    1: {beta: 0.8, airlight: 220.0}
    2: {beta: 1.4, airlight: 220.0}
    3: {beta: 2.0, airlight: 220.0}
    4: {beta: 2.8, airlight: 220.0}
    5: {beta: 3.8, airlight: 220.0}

  # Rain corruption parameters per severity
  rain:
    1: {drops: 600, length: 15, angle: -30, blur: 3, darken: 0.95}
    2: {drops: 1400, length: 22, angle: -32, blur: 3, darken: 0.90}
    3: {drops: 2600, length: 30, angle: -35, blur: 5, darken: 0.82}
    4: {drops: 4500, length: 40, angle: -38, blur: 5, darken: 0.72}
    5: {drops: 7500, length: 50, angle: -40, blur: 7, darken: 0.60}

  # Gaussian blur parameters per severity
  gaussian_blur:
    1: {ksize: 5, sigma: 1.2}
    2: {ksize: 9, sigma: 2.2}
    3: {ksize: 15, sigma: 3.8}
    4: {ksize: 21, sigma: 5.5}
    5: {ksize: 31, sigma: 8.0}

  # Gaussian noise parameters per severity
  gaussian_noise:
    1: {sigma: 8.0}
    2: {sigma: 18.0}
    3: {sigma: 32.0}
    4: {sigma: 50.0}
    5: {sigma: 75.0}

evaluation:
  ignore_index: 255
  data_dir: "data/samples"
  label_dir: "data/labels"
  batch_size: 1
  save_predictions: true

video:
  frame_skip: 1
  overlay_alpha: 0.5
  output_fps: 20.0

# Display settings
display:
  max_width: 1200
  max_height: 800

# Resource limits to prevent DoS
resources:
  max_image_dimension: 4096
  max_image_pixels: 8000000
  max_video_duration_seconds: 60
  max_video_file_size_mb: 500
  max_image_file_size_mb: 100
