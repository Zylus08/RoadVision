# RoadVision System Configuration

model:
  name: "nvidia/segformer-b0-finetuned-cityscapes-1024-1024"
  architecture: "segformer"
  device: "auto" # 'auto', 'cuda', or 'cpu'
  input_size: [1024, 1024] # [H, W] or native
  cache_dir: "E:/RoadVision/.cache/huggingface"
  torch_cache_dir: "E:/RoadVision/.cache/torch"

# Cityscapes 19 official evaluation classes
classes:
  0: "road"
  1: "sidewalk"
  2: "building"
  3: "wall"
  4: "fence"
  5: "pole"
  6: "traffic light"
  7: "traffic sign"
  8: "vegetation"
  9: "terrain"
  10: "sky"
  11: "person"
  12: "rider"
  13: "car"
  14: "truck"
  15: "bus"
  16: "train"
  17: "motorcycle"
  18: "bicycle"

palette:
  0: [128, 64, 128]    # road: purple
  1: [244, 35, 232]    # sidewalk: pink
  2: [70, 70, 70]      # building: dark grey
  3: [102, 102, 156]   # wall: blue-grey
  4: [190, 153, 153]   # fence: light mauve
  5: [153, 153, 153]   # pole: medium grey
  6: [250, 170, 30]    # traffic light: orange-yellow
  7: [220, 220, 0]     # traffic sign: yellow
  8: [107, 142, 35]    # vegetation: olive green
  9: [152, 251, 152]   # terrain: pale green
  10: [70, 130, 180]   # sky: steel blue
  11: [220, 20, 60]    # person: red
  12: [255, 0, 0]      # rider: bright red
  13: [0, 0, 142]      # car: deep blue
  14: [0, 0, 70]       # truck: navy
  15: [0, 60, 100]     # bus: teal-blue
  16: [0, 80, 100]     # train: dark cyan
  17: [0, 0, 230]      # motorcycle: royal blue
  18: [119, 11, 32]    # bicycle: dark red

corruptions:
  seed: 42
  types:
    - "low_light"
    - "fog"
    - "rain"
    - "gaussian_blur"
    - "gaussian_noise"
  severities: [1, 2, 3, 4, 5]

evaluation:
  ignore_index: 255
  data_dir: "data/samples"
  label_dir: "data/labels"
  batch_size: 1
  save_predictions: true

video:
  frame_skip: 1
  overlay_alpha: 0.5
  output_fps: 20.0
